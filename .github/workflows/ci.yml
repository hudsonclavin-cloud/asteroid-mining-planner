name: CI

# First committed workflow in this repo (Slice 14 Phase A / DEC-14-5).
# Type-regression gate ONLY. It is deliberately SEPARATE from the GitHub Pages
# deploy: it never builds docs/, never deploys, never writes to the repo.
# Pages continues to serve from the committed docs/ folder via built-in
# branch-deploy, entirely untouched by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
